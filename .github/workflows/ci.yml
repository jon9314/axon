name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run backend checks
        run: |
          echo "=== Running ruff format check ==="
          poetry run ruff format --check . || exit 1
          echo "=== Running ruff linter ==="
          poetry run ruff check . || exit 1
          echo "=== Installing types ==="
          poetry run pip install types-pyyaml || true
          echo "=== Running mypy ==="
          poetry run mypy . --show-error-codes || exit 1
          echo "=== Running pytest ==="
          poetry run pytest -q --tb=short || exit 1
          echo "=== Running memory tests ==="
          poetry run pytest -q tests/memory || exit 1
          echo "=== Running ensure_small_diff ==="
          poetry run python tools/ensure_small_diff.py || exit 1
          echo "=== All checks passed ==="

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-fund --no-audit

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Build
        working-directory: frontend
        run: npm run build
